<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hakodate Cycling Telemetry Dashboard</title>
<style>
html,
body {
    margin:0;
    padding:0;
    width:100%;
    background:#ffffff;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

* {
    box-sizing:border-box;
}

.dashboard-wrap {
    width:100%;
    height:920px;
    margin:0;
    padding:0;
    background:#ffffff;
    line-height:0;
    overflow:hidden;
}

.dashboard-frame {
    position:relative;
    width:100%;
    height:920px;
    overflow:hidden;
    border-radius:10px;
    background:#ffffff;
    margin:0;
    padding:0;
}

.dashboard-frame iframe {
    width:100%;
    height:920px;
    border:none;
    display:block;
    overflow:hidden;
    background:#ffffff;
    margin:0;
    padding:0;
    vertical-align:top;
}

@media (max-width:768px) {
    .dashboard-wrap,
    .dashboard-frame,
    .dashboard-frame iframe {
        height:760px;
    }
}
</style>
</head>
<body>

<div class="dashboard-wrap" id="dashboardWrap">

    <div class="dashboard-frame">

        <iframe
            id="hakodateTelemetryFrame"
            src="hakodate_cycling_telemetry_map.html?v=4"
            scrolling="no"
            loading="lazy"
            title="Hakodate Cycling Telemetry Dashboard">
        </iframe>

    </div>

</div>

<script>
(function () {

    function sendHeight() {

        var wrap = document.getElementById('dashboardWrap');

        if (!wrap || !window.parent) {
            return;
        }

        var height = Math.ceil(
            wrap.getBoundingClientRect().height
        );

        window.parent.postMessage({
            type: 'resize',
            source: 'rivers-hakodate-dashboard',
            height: height
        }, '*');

    }

    function queueHeight() {

        requestAnimationFrame(function () {

            requestAnimationFrame(sendHeight);

        });

    }

    // Update CARTO basemap tiles in the same-origin Leaflet map iframe.
    // Keep the generated telemetry map and all existing interactions intact.
    function configureCartoTiles() {
        var frame = document.getElementById('hakodateTelemetryFrame');
        if (!frame) return;
        try {
            var win = frame.contentWindow;
            if (!win || !win.L || !win.L.TileLayer) return;
            Object.keys(win).forEach(function(name) {
                var map = win[name];
                if (!map || !(map instanceof win.L.Map)) return;
                map.eachLayer(function(layer) {
                    if (!(layer instanceof win.L.TileLayer)) return;
                    var url = layer._url || '';
                    if (url.indexOf('basemaps.cartocdn.com') === -1) return;
                    if (/[?&]key=/.test(url)) return;
                    var separator = url.indexOf('?') === -1 ? '?' : '&';
                    layer.setUrl(url + separator + 'key=cb1_4qia_1_5eccccbfd768f4111186739b');
                });
            });
        } catch (error) {
            // Never interfere with loading the underlying map.
            console.warn('CARTO basemap configuration:', error);
        }
    }

    var telemetryFrame = document.getElementById('hakodateTelemetryFrame');
    if (telemetryFrame) {
        telemetryFrame.addEventListener('load', configureCartoTiles);
    }

    window.addEventListener('load', queueHeight);
    window.addEventListener('resize', queueHeight);

    queueHeight();

})();
</script>

</body>
</html>
