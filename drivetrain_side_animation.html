<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drivetrain Regulation System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;margin:0;padding:0;background:#fff;color:#1a1a1a;font-family:'DM Sans',sans-serif;height:auto;overflow:hidden}
body{padding:0 14px 14px}
.dt-root{width:100%;padding-top:0;background:transparent;overflow:visible}
.dt-header{padding-top:2px;margin-bottom:14px}
.dt-eyebrow{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.16em;color:#520671;text-transform:uppercase;margin-bottom:7px}
.dt-title{font-size:32px;font-weight:500;color:#111;line-height:1.15;letter-spacing:-.01em}
.dt-subtitle{font-family:'DM Mono',monospace;font-size:15px;color:#9a9890;margin-top:7px;letter-spacing:.04em}
.dt-stage{width:100%;min-height:310px;margin-top:2px}
svg{width:100%;height:300px;display:block;overflow:visible}
.frame{fill:none;stroke:#4c5359;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.frame-muted{fill:none;stroke:#d8d6d0;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ring{fill:none;stroke:#4c5359;stroke-width:2.1}.ring.active{stroke:#520671;filter:drop-shadow(0 0 5px rgba(82,6,113,.16))}
.cassette-ring{fill:none;stroke:#d8d6d0;stroke-width:1.15;transition:stroke .25s,stroke-width .25s}.cassette-ring.active{stroke:#520671;stroke-width:2.2;filter:drop-shadow(0 0 4px rgba(82,6,113,.16))}
.chain{fill:none;stroke:#4c5359;stroke-width:4.8;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box}.chain.active{stroke:#520671}.chain.shift{animation:chainShift .6s ease-in-out 1}
@keyframes chainShift{0%{transform:translateX(0)}30%{transform:translateX(6px)}70%{transform:translateX(-3px)}100%{transform:translateX(0)}}
.chain-shadow{fill:none;stroke:#ece9e3;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.pulley{fill:#fff;stroke:#4c5359;stroke-width:1.8}.pulley.active{stroke:#520671}
.guide-line{fill:none;stroke:#7d8551;stroke-width:1.6;stroke-dasharray:5 5;opacity:.65}.feedback-line{fill:none;stroke:#2e6f9e;stroke-width:1.6;stroke-dasharray:3 6;opacity:.65}
.shift-line{fill:none;stroke:#520671;stroke-width:1.6;stroke-dasharray:4 6;opacity:0;transition:opacity .35s}.shift-line.active{opacity:.75}
.signal-line{fill:none;stroke:#7d8551;stroke-width:1.45;stroke-dasharray:4 6;opacity:.45}.signal-line.active{stroke:#520671;opacity:.78}
.metric-path{fill:none;stroke:#2e6f9e;stroke-width:1.35;stroke-dasharray:3 7;opacity:.42}.metric-path.active{opacity:.75}
.head-unit{fill:#f0efeb;stroke:#d8d6d0;stroke-width:1.5}.head-unit.active{stroke:#520671;filter:drop-shadow(0 0 5px rgba(82,6,113,.12))}
.head-screen{fill:#fff;stroke:#ece9e3;stroke-width:1}.pm-node{fill:#f0efeb;stroke:#d8d6d0;stroke-width:1.5}.pm-node.active{fill:#520671;stroke:#520671}
.data-pulse{opacity:.75}.data-trail{opacity:.22}
.label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;fill:#b8b5ae;text-transform:uppercase}.label.active{fill:#520671}
.tiny-label{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.06em;fill:#b8b5ae;text-transform:uppercase}.tiny-label.active{fill:#520671}
.gear-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.06em;fill:#b8b5ae;text-transform:uppercase}.gear-value{font-family:'DM Mono',monospace;font-size:18px;fill:#520671;letter-spacing:.03em}.gear-seq{font-family:'DM Mono',monospace;font-size:7.5px;fill:#c8c6c0;letter-spacing:.02em}
.dot{fill:#f0efeb;stroke:#d8d6d0;stroke-width:1.5;cursor:pointer;transition:all .35s cubic-bezier(.4,0,.2,1)}.dot.active{fill:#520671;stroke:#520671}.dot.done{fill:#edf5ef;stroke:#b8d8bf}
.dot-text{font-family:'DM Mono',monospace;font-size:10px;fill:#9a9890;pointer-events:none}.dot-text.active{fill:#fff}.dot-text.done{fill:#4a8f5c}
.crank-rotor,.cassette-rotor,.pulley-rotor{transform-box:fill-box;transform-origin:center;animation:turn 8s linear infinite}.cassette-rotor{animation-duration:5.8s}.pulley-rotor{animation-duration:4.4s}.fast .crank-rotor{animation-duration:4.8s}.fast .cassette-rotor{animation-duration:3.4s}.fast .pulley-rotor{animation-duration:2.8s}
@keyframes turn{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.crank-rotor,.cassette-rotor,.pulley-rotor{animation:none}.chain.shift{animation:none}.data-pulse,.data-trail{display:none}}
.info-panel{margin-top:-8px;border-top:1px solid #ece9e3;padding-top:12px}.panel-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#520671;margin-bottom:3px}.panel-title{font-size:15px;font-weight:500;color:#111;line-height:1.3}.panel-text{margin-top:5px;font-size:12px;line-height:1.55;color:#6e6c66;max-width:780px}
.dt-controls{display:flex;align-items:center;gap:10px;margin-top:14px}button{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1px solid #d8d6d0;color:#888680;padding:7px 14px;border-radius:7px;cursor:pointer;transition:all .2s}button:hover:not(:disabled){border-color:#520671;color:#520671}button.primary{background:#520671;border-color:#520671;color:#fff;padding:7px 20px}button.primary:hover:not(:disabled){background:#3f0457;border-color:#3f0457}button:disabled{opacity:.28;cursor:default}
.dt-progress{flex:1;height:2px;background:#e4e2dc;border-radius:2px;overflow:hidden}.dt-progress-fill{height:100%;background:#520671;border-radius:2px;transition:width .4s cubic-bezier(.4,0,.2,1)}.dt-counter{font-family:'DM Mono',monospace;font-size:11px;color:#c0beb8;white-space:nowrap}.dt-auto{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:rgba(82,6,113,.08);color:#520671;border:1px solid rgba(82,6,113,.25);padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}.dt-auto.on{background:rgba(82,6,113,.16);border-color:rgba(82,6,113,.5)}
.dt-footer{margin-top:14px;padding-top:12px;border-top:1px solid #ece9e3;display:flex;justify-content:space-between;align-items:center}.dt-footer-left{font-family:'DM Mono',monospace;font-size:10px;color:#c8c6c0;letter-spacing:.06em}.dt-pips{display:flex;gap:5px}.dt-pip{width:6px;height:6px;border-radius:50%;background:#dedad4;transition:all .3s;cursor:pointer}.dt-pip.active{background:#520671}.dt-pip.done{background:#7ab888}.dt-pip:hover{transform:scale(1.3)}
@media(max-width:850px){body{padding:0 8px 10px}.dt-title{font-size:22px}.dt-subtitle{font-size:11px}.dt-eyebrow{font-size:10px}.dt-stage{min-height:285px}svg{height:268px}.panel-title{font-size:14px}.panel-text{font-size:11.5px}.dt-controls{flex-wrap:wrap}.tiny-label{font-size:7.5px}.gear-seq{font-size:6.5px}.gear-value{font-size:15px}}
</style>
</head>
<body>
<div class="dt-root" id="root">
  <div class="dt-header"><div class="dt-eyebrow">Rivers Lab Drivetrain Model</div><h1 class="dt-title">Physical Effort Becomes Ride Data</h1><div class="dt-subtitle">Force → Sensor Capture → ANT+ / Bluetooth → Head Unit → Data Storage</div></div>
  <div class="dt-stage"><svg viewBox="0 0 920 310" role="img" aria-label="Side-view drivetrain with wireless ride metric transfer and animated cassette ratios">
    <path class="frame-muted" d="M180 85 L330 190 L520 78 L690 198 M330 190 L520 78 M520 78 L558 45 M530 45 L585 45 M690 198 L612 78"></path><path class="guide-line" d="M162 238 Q450 292 738 238"></path><path class="feedback-line" d="M704 96 Q488 12 273 96"></path><path id="shift-path" class="shift-line" d="M690 198 C640 145 615 122 570 105"></path><path id="signal-line" class="signal-line" d="M382 160 Q540 16 812 55"></path><path id="metric-path" class="metric-path" d="M812 78 Q706 111 690 150"></path>
    <circle class="data-pulse" r="3.2" fill="#520671"><animateMotion dur="2.7s" repeatCount="indefinite"><mpath href="#signal-line"/></animateMotion></circle><circle class="data-pulse" r="2.8" fill="#2e6f9e"><animateMotion dur="2.7s" begin="1.25s" repeatCount="indefinite"><mpath href="#signal-line"/></animateMotion></circle><circle class="data-trail" r="2.6" fill="#520671"><animateMotion dur="3.2s" begin="0.6s" repeatCount="indefinite"><mpath href="#metric-path"/></animateMotion></circle><circle class="data-trail" r="2.2" fill="#2e6f9e"><animateMotion dur="3.4s" begin="1.4s" repeatCount="indefinite"><mpath href="#metric-path"/></animateMotion></circle>
    <rect id="head-unit" class="head-unit" x="804" y="31" width="92" height="54" rx="10"></rect><rect class="head-screen" x="820" y="44" width="60" height="24" rx="4"></rect><text class="tiny-label" x="850" y="60" text-anchor="middle">GARMIN</text><text id="wireless-label" class="tiny-label" x="455" y="28">ANT+ / Bluetooth</text><text id="metric-label" class="tiny-label" x="770" y="102">recording ride metrics</text>
    <path class="chain-shadow" d="M330 190 C410 155 520 112 690 150 C724 160 724 208 690 220 C555 228 430 218 330 190"></path><path id="chain" class="chain" d="M330 190 C410 155 520 112 690 150 C724 160 724 208 690 220 C555 228 430 218 330 190"></path>
    <g id="crank-rotor" class="crank-rotor"><circle id="chainring" class="ring" cx="330" cy="190" r="62"></circle><circle class="ring" cx="330" cy="190" r="42" style="stroke:#d8d6d0;stroke-width:1.2"></circle><path class="frame" d="M330 190 L382 160"></path><line id="power-pedal" class="frame" x1="378" y1="158" x2="398" y2="158"></line><circle id="pm-node" class="pm-node" cx="400" cy="158" r="6"></circle><path class="frame-muted" d="M330 190 L278 220"></path></g>
    <g id="cassette-rotor"><circle id="cassette" class="ring" cx="690" cy="185" r="44"></circle></g>
  </svg></div>
</div>
</body>
</html>
