
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hakodate Systems Pulse</title>
<style>
  body {
    margin: 0;
    background: #ffffff;
    font-family: "DM Mono", monospace;
    color: #6e6c66;
    overflow: hidden;
  }

  .wrap {
    width: 100%;
    max-width: 1000px;
    height: 560px;
    margin: 0 auto;
    position: relative;
    background: radial-gradient(circle at center, #f7f3fa 0%, #ffffff 60%);
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .title {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #520671;
    font-size: 20px;
    font-weight: 700;
  }

  .subtitle {
    position: absolute;
    top: 48px;
    left: 20px;
    font-size: 14px;
    color: #9a9890;
  }

  .footer {
    position: absolute;
    bottom: 16px;
    left: 20px;
    right: 20px;
    font-size: 13px;
    line-height: 1.4;
    color: #6e6c66;
  }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="pulse"></canvas>

  <div class="title">Hakodate Systems Pulse</div>
  <div class="subtitle">Learning · Cycling · Data · Environment · Behaviour</div>

  <div class="footer">
    A visual model of behaviour as a dynamic system shaped by place, technology, information, and adaptation.
  </div>
</div>

<script>
const canvas = document.getElementById("pulse");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
  const rect = canvas.getBoundingClientRect();
  W = canvas.width = rect.width * devicePixelRatio;
  H = canvas.height = rect.height * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
resize();
window.addEventListener("resize", resize);

const nodes = [
  { label: "Educational Psychology and Learning Systems", x: 0.50, y: 0.28, r: 34 },
  { label: "Language and Media Communication Systems", x: 0.30, y: 0.48, r: 28 },
  { label: "Human-Machine Systems", x: 0.70, y: 0.48, r: 30 },
  { label: "Cycling", x: 0.40, y: 0.70, r: 26 },
  { label: "Data", x: 0.60, y: 0.70, r: 24 },
  { label: "Behaviour", x: 0.50, y: 0.52, r: 32 }
];

const links = [
  [0,1], [0,2], [0,5],
  [1,3], [2,3], [3,4],
  [4,5], [5,1], [5,2]
];

let t = 0;

function draw() {
  ctx.clearRect(0, 0, W, H);

  const width = canvas.clientWidth;
  const height = canvas.clientHeight;

  const mapped = nodes.map(n => ({
    ...n,
    px: n.x * width + Math.sin(t * 0.01 + n.x * 10) * 8,
    py: n.y * height + Math.cos(t * 0.012 + n.y * 10) * 8
  }));

  ctx.lineWidth = 1.2;

  links.forEach(([a,b], i) => {
    const A = mapped[a];
    const B = mapped[b];

    const pulse = (Math.sin(t * 0.04 + i) + 1) / 2;

    ctx.strokeStyle = `rgba(82, 6, 113, ${0.16 + pulse * 0.28})`;
    ctx.beginPath();
    ctx.moveTo(A.px, A.py);
    ctx.lineTo(B.px, B.py);
    ctx.stroke();

    const px = A.px + (B.px - A.px) * pulse;
    const py = A.py + (B.py - A.py) * pulse;

    ctx.fillStyle = "rgba(82, 6, 113, 0.7)";
    ctx.beginPath();
    ctx.arc(px, py, 3, 0, Math.PI * 2);
    ctx.fill();
  });

  mapped.forEach((n, i) => {
    const glow = (Math.sin(t * 0.035 + i) + 1) / 2;

    ctx.fillStyle = `rgba(82, 6, 113, ${0.06 + glow * 0.06})`;
    ctx.beginPath();
    ctx.arc(n.px, n.py, n.r + 12 + glow * 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#520671";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(n.px, n.py, n.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#520671";
    ctx.font = "13px DM Mono, monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(n.label, n.px, n.py);
  });

  t++;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
