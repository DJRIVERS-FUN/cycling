
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hakodate Systems Pulse</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: "DM Mono", monospace;
    overflow: hidden;
  }

  .wrap {
    width: 100%;
    max-width: 1120px;
    height: 780px;
    margin: 0 auto;
    position: relative;
    background: #ffffff;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="pulse"></canvas>
</div>

<script>
const canvas = document.getElementById("pulse");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
  const rect = canvas.getBoundingClientRect();
  W = canvas.width = rect.width * devicePixelRatio;
  H = canvas.height = rect.height * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
resize();
window.addEventListener("resize", resize);

const nodes = [
  // Research themes
  { group:"theme", label:"Educational\nPsychology\nand Learning\nSystems", x:0.25, y:0.32, r:86, fill:"#eadff3", stroke:"#520671", text:"#3b2348" },
  { group:"theme", label:"Language\nand Media\nCommunication\nSystems", x:0.50, y:0.24, r:86, fill:"#f8e7d8", stroke:"#b64a24", text:"#553225" },
  { group:"theme", label:"Human–Machine\nSystems", x:0.75, y:0.32, r:86, fill:"#dcefeb", stroke:"#3f6f67", text:"#294a45" },

  // Workflow model
  { group:"workflow", label:"Constraint", x:0.20, y:0.70, r:56, fill:"#eeeeec", stroke:"#6e6c66", text:"#4f4d49" },
  { group:"workflow", label:"Behaviour", x:0.40, y:0.70, r:56, fill:"#fde6d8", stroke:"#e05c2a", text:"#7a351f" },
  { group:"workflow", label:"Adaptation", x:0.60, y:0.70, r:56, fill:"#f6e5ef", stroke:"#9b5b84", text:"#604159" },
  { group:"workflow", label:"Outcome", x:0.80, y:0.70, r:56, fill:"#e8e0f0", stroke:"#520671", text:"#3b2348" }
];

const themeLinks = [[0,1],[1,2],[0,2]];
const workflowLinks = [[3,4],[4,5],[5,6]];

let t = 0;

function drawTextBlock(text,x,y,maxWidth,lineHeight){
  const lines=text.split("\n");
  const startY=y-((lines.length-1)*lineHeight)/2;
  lines.forEach((line,i)=>ctx.fillText(line,x,startY+i*lineHeight,maxWidth));
}

function drawBackground(width,height){
  // Two large Venn-like conceptual fields: Themes and Workflow.
  ctx.save();
  ctx.globalAlpha = 1;

  ctx.fillStyle = "rgba(82, 6, 113, 0.045)";
  ctx.strokeStyle = "rgba(82, 6, 113, 0.12)";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.ellipse(width*0.50, height*0.35, width*0.38, height*0.25, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "rgba(224, 92, 42, 0.050)";
  ctx.strokeStyle = "rgba(224, 92, 42, 0.14)";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.ellipse(width*0.50, height*0.62, width*0.42, height*0.24, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function drawDarkThemeLine(A,B){
  const pulse=(Math.sin(t*0.025)+1)/2;
  ctx.strokeStyle=`rgba(58,42,77,${0.35 + pulse*0.08})`;
  ctx.lineWidth=1.8;
  ctx.beginPath();
  ctx.moveTo(A.px,A.py);
  ctx.lineTo(B.px,B.py);
  ctx.stroke();
}

function drawArrow(A,B,color,width,pulseOffset){
  const angle=Math.atan2(B.py-A.py,B.px-A.px);
  const startX=A.px+Math.cos(angle)*(A.r+6);
  const startY=A.py+Math.sin(angle)*(A.r+6);
  const endX=B.px-Math.cos(angle)*(B.r+10);
  const endY=B.py-Math.sin(angle)*(B.r+10);

  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.beginPath();
  ctx.moveTo(startX,startY);
  ctx.lineTo(endX,endY);
  ctx.stroke();

  const head=9;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(endX,endY);
  ctx.lineTo(endX-head*Math.cos(angle-Math.PI/6),endY-head*Math.sin(angle-Math.PI/6));
  ctx.lineTo(endX-head*Math.cos(angle+Math.PI/6),endY-head*Math.sin(angle+Math.PI/6));
  ctx.closePath();
  ctx.fill();

  const pulse=(Math.sin(t*0.04+pulseOffset)+1)/2;
  const px=startX+(endX-startX)*pulse;
  const py=startY+(endY-startY)*pulse;
  ctx.beginPath();
  ctx.arc(px,py,3.1,0,Math.PI*2);
  ctx.fill();
}

function draw(){
  ctx.clearRect(0,0,W,H);

  const width=canvas.clientWidth;
  const height=canvas.clientHeight;

  drawBackground(width,height);

  const mapped=nodes.map(n=>({
    ...n,
    px:n.x*width+Math.sin(t*0.005+n.x*10)*(n.group==="theme" ? 7 : 5),
    py:n.y*height+Math.cos(t*0.007+n.y*10)*(n.group==="theme" ? 7 : 5)
  }));

  // Only three structural lines between research themes.
  themeLinks.forEach(([a,b])=>drawDarkThemeLine(mapped[a],mapped[b]));

  // Only the central workflow has directional movement.
  workflowLinks.forEach(([a,b],i)=>drawArrow(mapped[a],mapped[b],"rgba(224,92,42,0.78)",2.3,i*1.6));

  mapped.forEach((n,i)=>{
    const glow=(Math.sin(t*0.024+i)+1)/2;
    ctx.fillStyle=n.group==="theme" ? `rgba(82,6,113,${0.025+glow*0.025})` : `rgba(224,92,42,${0.020+glow*0.025})`;
    ctx.beginPath();
    ctx.arc(n.px,n.py,n.r+12+glow*5,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle=n.fill;
    ctx.strokeStyle=n.stroke;
    ctx.lineWidth=n.group==="theme" ? 2.0 : 1.8;
    ctx.beginPath();
    ctx.arc(n.px,n.py,n.r,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle=n.text;
    ctx.font=n.group==="theme" ? "13px DM Mono, monospace" : "14px DM Mono, monospace";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    drawTextBlock(n.label,n.px,n.py,n.r*1.55,n.group==="theme" ? 17 : 18);
  });

  t++;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
