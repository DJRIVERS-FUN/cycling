
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hakodate Systems Pulse</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: "DM Mono", monospace;
    overflow: hidden;
  }

  .wrap {
    width: 100%;
    max-width: 1120px;
    height: 780px;
    margin: 0 auto;
    position: relative;
    background: #ffffff;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="pulse"></canvas>
</div>

<script>
const canvas = document.getElementById("pulse");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
  const rect = canvas.getBoundingClientRect();
  W = canvas.width = rect.width * devicePixelRatio;
  H = canvas.height = rect.height * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
resize();
window.addEventListener("resize", resize);

// Soft pastel palette
const nodes = [
  { type:"domain", label:"Educational\nPsychology\nand Learning\nSystems", x:0.50, y:0.15, r:96, fill:"#e8dcf2", stroke:"#3a2a4d", text:"#3a2a4d" },
  { type:"domain", label:"Language\nand Media\nCommunication\nSystems", x:0.17, y:0.58, r:96, fill:"#f5e6da", stroke:"#3a2a4d", text:"#3a2a4d" },
  { type:"domain", label:"Human–Machine\nSystems", x:0.83, y:0.58, r:96, fill:"#dff1ec", stroke:"#3a2a4d", text:"#3a2a4d" },

  { type:"concept", label:"Constraint", x:0.30, y:0.40, r:60, fill:"#f2f2f2", stroke:"#6e6c66", text:"#6e6c66" },
  { type:"concept", label:"Behaviour", x:0.43, y:0.56, r:60, fill:"#ffe9dd", stroke:"#e05c2a", text:"#a6461f" },
  { type:"concept", label:"Adaptation", x:0.57, y:0.56, r:60, fill:"#fff2e8", stroke:"#e05c2a", text:"#a6461f" },
  { type:"concept", label:"Outcome", x:0.70, y:0.40, r:60, fill:"#efe7f7", stroke:"#520671", text:"#520671" }
];

const flowLinks = [ [3,4],[4,5],[5,6] ];

const domainLinks = [
  [0,3],[0,4],[0,5],[0,6],
  [1,3],[1,4],[1,5],[1,6],
  [2,3],[2,4],[2,5],[2,6]
];

let t = 0;

function drawTextBlock(text,x,y,maxWidth,lineHeight){
  const lines=text.split("\n");
  const startY=y-((lines.length-1)*lineHeight)/2;
  lines.forEach((line,i)=>{
    ctx.fillText(line,x,startY+i*lineHeight,maxWidth);
  });
}

function drawArrow(A,B,color,width,pulseOffset){
  const angle=Math.atan2(B.py-A.py,B.px-A.px);
  const startX=A.px+Math.cos(angle)*(A.r+6);
  const startY=A.py+Math.sin(angle)*(A.r+6);
  const endX=B.px-Math.cos(angle)*(B.r+10);
  const endY=B.py-Math.sin(angle)*(B.r+10);

  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.beginPath();
  ctx.moveTo(startX,startY);
  ctx.lineTo(endX,endY);
  ctx.stroke();

  const head=9;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(endX,endY);
  ctx.lineTo(endX-head*Math.cos(angle-Math.PI/6),endY-head*Math.sin(angle-Math.PI/6));
  ctx.lineTo(endX-head*Math.cos(angle+Math.PI/6),endY-head*Math.sin(angle+Math.PI/6));
  ctx.closePath();
  ctx.fill();

  const pulse=(Math.sin(t*0.04+pulseOffset)+1)/2;
  const px=startX+(endX-startX)*pulse;
  const py=startY+(endY-startY)*pulse;

  ctx.beginPath();
  ctx.arc(px,py,3,0,Math.PI*2);
  ctx.fill();
}

function drawLine(A,B){
  ctx.strokeStyle="#3a2a4d";
  ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(A.px,A.py);
  ctx.lineTo(B.px,B.py);
  ctx.stroke();
}

function draw(){
  ctx.clearRect(0,0,W,H);

  const width=canvas.clientWidth;
  const height=canvas.clientHeight;

  let mapped=nodes.map(n=>({
    ...n,
    px:n.x*width+Math.sin(t*0.006+n.x*10)*8,
    py:n.y*height+Math.cos(t*0.008+n.y*10)*8
  }));

  // domain connections (dark lines)
  domainLinks.forEach(([a,b])=>drawLine(mapped[a],mapped[b]));

  // flow arrows
  flowLinks.forEach(([a,b],i)=>drawArrow(mapped[a],mapped[b],"#e05c2a",2.4,i));

  mapped.forEach(n=>{
    ctx.fillStyle=n.fill;
    ctx.strokeStyle=n.stroke;
    ctx.lineWidth=2.2;

    ctx.beginPath();
    ctx.arc(n.px,n.py,n.r,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle=n.text;
    ctx.font="14px DM Mono, monospace";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    drawTextBlock(n.label,n.px,n.py,n.r*1.6,18);
  });

  t++;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
