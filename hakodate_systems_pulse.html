
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hakodate Systems Pulse</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: "DM Mono", monospace;
    color: #6e6c66;
    overflow: hidden;
  }

  .wrap {
    width: 100%;
    max-width: 1000px;
    height: 680px;
    margin: 0 auto;
    position: relative;
    background: radial-gradient(circle at center, #f7f3fa 0%, #ffffff 62%);
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .title {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #520671;
    font-size: 20px;
    font-weight: 700;
  }

  .subtitle {
    position: absolute;
    top: 50px;
    left: 20px;
    font-size: 14px;
    color: #9a9890;
  }

  .footer {
    position: absolute;
    bottom: 16px;
    left: 20px;
    right: 20px;
    font-size: 13px;
    line-height: 1.4;
    color: #6e6c66;
    background: rgba(255,255,255,0.72);
    padding: 6px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="pulse"></canvas>

  <div class="title">Hakodate Systems Pulse</div>
  <div class="subtitle">Learning · Communication · Human–Machine Systems</div>

  <div class="footer">
    A visual model of behaviour as a dynamic system shaped by place, technology, information, and adaptation.
  </div>
</div>

<script>
const canvas = document.getElementById("pulse");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
  const rect = canvas.getBoundingClientRect();
  W = canvas.width = rect.width * devicePixelRatio;
  H = canvas.height = rect.height * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
resize();
window.addEventListener("resize", resize);

const nodes = [
  { label: "Educational\nPsychology\nand Learning\nSystems", x: 0.50, y: 0.18, r: 95, color: "#520671" },
  { label: "Language\nand Media\nCommunication\nSystems", x: 0.20, y: 0.55, r: 95, color: "#7c4dff" },
  { label: "Human–Machine\nSystems", x: 0.80, y: 0.55, r: 95, color: "#26a69a" },
  { label: "Education\nand Research", x: 0.50, y: 0.60, r: 90, color: "#ab47bc" }
];

const links = [
  [0,1], [0,2], [0,3],
  [1,3], [2,3]
];

let t = 0;

function drawTextBlock(text, x, y, maxWidth, lineHeight) {
  const lines = text.split("\n");
  const startY = y - ((lines.length - 1) * lineHeight) / 2;
  lines.forEach((line, index) => {
    ctx.fillText(line, x, startY + index * lineHeight, maxWidth);
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  const width = canvas.clientWidth;
  const height = canvas.clientHeight;

  let mapped = nodes.map(n => ({
    ...n,
    px: n.x * width + Math.sin(t * 0.008 + n.x * 10) * 18,
    py: n.y * height + Math.cos(t * 0.010 + n.y * 10) * 18
  }));

  for (let i = 0; i < mapped.length; i++) {
    for (let j = i + 1; j < mapped.length; j++) {
      let dx = mapped[j].px - mapped[i].px;
      let dy = mapped[j].py - mapped[i].py;
      let dist = Math.sqrt(dx * dx + dy * dy) || 1;
      let minDist = mapped[i].r + mapped[j].r + 30;

      if (dist < minDist) {
        let angle = Math.atan2(dy, dx);
        let move = (minDist - dist) / 2;
        mapped[i].px -= Math.cos(angle) * move;
        mapped[i].py -= Math.sin(angle) * move;
        mapped[j].px += Math.cos(angle) * move;
        mapped[j].py += Math.sin(angle) * move;
      }
    }
  }

  ctx.lineWidth = 1.2;

  links.forEach(([a,b], i) => {
    const A = mapped[a];
    const B = mapped[b];
    const pulse = (Math.sin(t * 0.035 + i) + 1) / 2;

    ctx.strokeStyle = `rgba(82, 6, 113, ${0.12 + pulse * 0.22})`;
    ctx.beginPath();
    ctx.moveTo(A.px, A.py);
    ctx.lineTo(B.px, B.py);
    ctx.stroke();

    const px = A.px + (B.px - A.px) * pulse;
    const py = A.py + (B.py - A.py) * pulse;

    ctx.fillStyle = "rgba(82, 6, 113, 0.6)";
    ctx.beginPath();
    ctx.arc(px, py, 3.5, 0, Math.PI * 2);
    ctx.fill();
  });

  mapped.forEach((n, i) => {
    const glow = (Math.sin(t * 0.030 + i) + 1) / 2;

    ctx.fillStyle = `rgba(82, 6, 113, ${0.04 + glow * 0.05})`;
    ctx.beginPath();
    ctx.arc(n.px, n.py, n.r + 18 + glow * 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = n.color;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2.5;

    ctx.beginPath();
    ctx.arc(n.px, n.py, n.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "14px DM Mono, monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    drawTextBlock(n.label, n.px, n.py, n.r * 1.6, 18);
  });

  t++;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
