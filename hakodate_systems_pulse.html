
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hakodate Systems Pulse</title>
<style>
  html, body { margin:0; padding:0; background:#ffffff; font-family:"DM Mono", monospace; overflow:hidden; }
  .wrap { width:100%; max-width:1120px; height:660px; margin:0 auto; position:relative; background:#ffffff; }
  canvas { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<div class="wrap"><canvas id="pulse"></canvas></div>
<script>
const canvas=document.getElementById("pulse");const ctx=canvas.getContext("2d");let W,H;
const palette={purple:"#520671",deepPurple:"#3a2a4d",orange:"#e05c2a",grey:"#6e6c66"};
function resize(){const r=canvas.getBoundingClientRect();W=canvas.width=r.width*devicePixelRatio;H=canvas.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}resize();window.addEventListener("resize",resize);

const nodes=[
{type:"domain",label:"Educational\nPsychology\nand Learning\nSystems",x:0.50,y:0.17,r:90,fill:"#ffffff",stroke:"#520671",text:"#520671",halo:"#520671"},
{type:"domain",label:"Language\nand Media\nCommunication\nSystems",x:0.18,y:0.55,r:90,fill:"#ffffff",stroke:"#e05c2a",text:"#6e3a27",halo:"#e05c2a"},
{type:"domain",label:"Human–Machine\nSystems",x:0.82,y:0.55,r:90,fill:"#ffffff",stroke:"#3f6f67",text:"#315852",halo:"#3f6f67"},

/* nudged up slightly */
{type:"concept",label:"Constraint",x:0.29,y:0.37,r:56,fill:"#eeeeec",stroke:"#6e6c66",text:"#4f4d49",halo:"#6e6c66"},
{type:"concept",label:"Behaviour",x:0.43,y:0.54,r:56,fill:"#fde6d8",stroke:"#e05c2a",text:"#7a351f",halo:"#e05c2a"},
{type:"concept",label:"Adaptation",x:0.57,y:0.54,r:56,fill:"#e3f0ed",stroke:"#3f6f67",text:"#315852",halo:"#3f6f67"},
{type:"concept",label:"Outcome",x:0.71,y:0.37,r:56,fill:"#e8e0f0",stroke:"#520671",text:"#3b2348",halo:"#520671"}
];

const flowLinks=[[3,4],[4,5],[5,6]];
const domainLinks=[[0,3],[0,4],[0,5],[0,6],[1,3],[1,4],[1,5],[1,6],[2,3],[2,4],[2,5],[2,6]];

let t=0;
function rgba(hex,a){const h=hex.replace("#","");return `rgba(${parseInt(h.substr(0,2),16)},${parseInt(h.substr(2,2),16)},${parseInt(h.substr(4,2),16)},${a})`;}
function drawTextBlock(txt,x,y,w,l){const lines=txt.split("\n");const start=y-((lines.length-1)*l)/2;lines.forEach((ln,i)=>ctx.fillText(ln,x,start+i*l,w));}

function drawArrow(A,B,col,a,w,p){const ang=Math.atan2(B.py-A.py,B.px-A.px);
const sx=A.px+Math.cos(ang)*(A.r+6), sy=A.py+Math.sin(ang)*(A.r+6);
const ex=B.px-Math.cos(ang)*(B.r+10), ey=B.py-Math.sin(ang)*(B.r+10);
ctx.strokeStyle=rgba(col,a);ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
const pulse=(Math.sin(t*0.04+p)+1)/2;const px=sx+(ex-sx)*pulse, py=sy+(ey-sy)*pulse;
ctx.fillStyle=rgba(col,a+0.25);ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();}

function drawSoft(A,B,a,p){const pulse=(Math.sin(t*0.03+p)+1)/2;
ctx.strokeStyle=rgba(palette.deepPurple,a+pulse*0.02);ctx.lineWidth=0.6;ctx.beginPath();ctx.moveTo(A.px,A.py);ctx.lineTo(B.px,B.py);ctx.stroke();}

function draw(){ctx.clearRect(0,0,W,H);
const w=canvas.clientWidth,h=canvas.clientHeight;
let mapped=nodes.map(n=>({...n,px:n.x*w+Math.sin(t*0.006+n.x*10)*(n.type==="domain"?10:6),py:n.y*h+Math.cos(t*0.008+n.y*10)*(n.type==="domain"?10:6)}));

domainLinks.forEach(([a,b],i)=>drawSoft(mapped[a],mapped[b],0.035,i));
flowLinks.forEach(([a,b],i)=>drawArrow(mapped[a],mapped[b],palette.orange,0.5,2.2,i));

mapped.forEach((n,i)=>{
const g=(Math.sin(t*0.026+i)+1)/2;
ctx.fillStyle=rgba(n.halo,n.type==="domain"?0.035+g*0.03:0.03+g*0.03);
ctx.beginPath();ctx.arc(n.px,n.py,n.r+(n.type==="domain"?16:12)+g*6,0,Math.PI*2);ctx.fill();
ctx.fillStyle=n.fill;ctx.strokeStyle=n.stroke;ctx.lineWidth=n.type==="domain"?2:1.8;
ctx.beginPath();ctx.arc(n.px,n.py,n.r,0,Math.PI*2);ctx.fill();ctx.stroke();
ctx.fillStyle=n.text;ctx.font=n.type==="domain"?"13px DM Mono":"14px DM Mono";ctx.textAlign="center";ctx.textBaseline="middle";
drawTextBlock(n.label,n.px,n.py,n.r*1.5,n.type==="domain"?17:18);
});

t++;requestAnimationFrame(draw);}draw();
</script>
</body>
</html>
