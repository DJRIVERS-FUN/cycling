<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Rivers Lab Research Framework</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    background:#ffffff;
    overflow:hidden;
    font-family:'Roboto',Arial,sans-serif;
  }
  .wrap{
    width:100%;
    height:590px;
    margin:0;
    position:relative;
    background:#ffffff;
    padding:8px 0 6px;
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
  }
  @media (max-width:900px){
    .wrap{height:590px;}
  }
  @media (max-width:640px){
    .wrap{height:590px;}
  }
</style>
</head>
<body>
<div class="wrap"><canvas id="pulse"></canvas></div>

<script>
const canvas=document.getElementById("pulse");
const ctx=canvas.getContext("2d");
let W,H;

const palette={
  purple:"#520671",
  deepPurple:"#3a2a4d",
  orange:"#d97706",
  paleOrange:"#fff7ed",
  grey:"#6e6c66"
};

function resize(){
  const r=canvas.getBoundingClientRect();
  W=canvas.width=r.width*devicePixelRatio;
  H=canvas.height=r.height*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resize();
window.addEventListener("resize",resize);

const nodes=[
  {
    type:"domain",
    label:"Learning &\nMetacognition",
    x:0.50,y:0.18,r:0.085,
    fill:"#ffffff",stroke:"#520671",text:"#520671",halo:"#520671"
  },
  {
    type:"domain",
    label:"Digital Discourse &\nPlatform Culture",
    x:0.18,y:0.66,r:0.085,
    fill:"#ffffff",stroke:"#520671",text:"#520671",halo:"#520671"
  },
  {
    type:"domain",
    label:"Human–Technology\nInteraction",
    x:0.82,y:0.66,r:0.085,
    fill:"#ffffff",stroke:"#520671",text:"#520671",halo:"#520671"
  },

  {
    type:"concept",
    label:"Constraint",
    x:0.29,y:0.38,r:0.050,
    fill:"#fff7ed",stroke:"#d97706",text:"#8a4b08",halo:"#d97706"
  },
  {
    type:"concept",
    label:"Interpretation",
    x:0.43,y:0.58,r:0.050,
    fill:"#fff7ed",stroke:"#d97706",text:"#8a4b08",halo:"#d97706"
  },
  {
    type:"concept",
    label:"Action",
    x:0.57,y:0.58,r:0.050,
    fill:"#fff7ed",stroke:"#d97706",text:"#8a4b08",halo:"#d97706"
  },
  {
    type:"concept",
    label:"Evaluation",
    x:0.71,y:0.38,r:0.050,
    fill:"#fff7ed",stroke:"#d97706",text:"#8a4b08",halo:"#d97706"
  }
];

const flowLinks=[[3,4],[4,5],[5,6]];
const domainLinks=[
  [0,3],[0,4],[0,5],[0,6],
  [1,3],[1,4],[1,5],[1,6],
  [2,3],[2,4],[2,5],[2,6]
];

let t=0;

function rgba(hex,a){
  const h=hex.replace("#","");
  return `rgba(${parseInt(h.substr(0,2),16)},${parseInt(h.substr(2,2),16)},${parseInt(h.substr(4,2),16)},${a})`;
}

function drawTextBlock(txt,x,y,w,l){
  const lines=txt.split("\n");
  const start=y-((lines.length-1)*l)/2;
  lines.forEach((ln,i)=>ctx.fillText(ln,x,start+i*l,w));
}

function nodeRadius(n,w,h){
  const base=Math.min(w,h);
  return Math.max(
    n.type==="domain"?76:48,
    Math.min(n.type==="domain"?112:68,base*n.r)
  );
}

function fontSize(n,w,h){
  const base=Math.min(w,h);
  return Math.max(
    n.type==="domain"?13:12,
    Math.min(n.type==="domain"?17:15,base*(n.type==="domain"?0.019:0.017))
  );
}

function drawArrow(A,B,col,a,w,p){
  const ang=Math.atan2(B.py-A.py,B.px-A.px);
  const sx=A.px+Math.cos(ang)*(A.r+6);
  const sy=A.py+Math.sin(ang)*(A.r+6);
  const ex=B.px-Math.cos(ang)*(B.r+10);
  const ey=B.py-Math.sin(ang)*(B.r+10);

  ctx.strokeStyle=rgba(col,a);
  ctx.lineWidth=w;
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(ex,ey);
  ctx.stroke();

  const pulse=(Math.sin(t*0.04+p)+1)/2;
  const px=sx+(ex-sx)*pulse;
  const py=sy+(ey-sy)*pulse;

  ctx.fillStyle=rgba(col,a+0.22);
  ctx.beginPath();
  ctx.arc(px,py,3.2,0,Math.PI*2);
  ctx.fill();
}

function drawSoft(A,B,a,p){
  const linkPulse=(Math.sin(t*0.03+p)+1)/2;

  ctx.strokeStyle=rgba(palette.purple,a+linkPulse*0.03);
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(A.px,A.py);
  ctx.lineTo(B.px,B.py);
  ctx.stroke();

  const travel=(t*0.006+p*0.13)%1;
  const px=A.px+(B.px-A.px)*travel;
  const py=A.py+(B.py-A.py)*travel;
  const glow=(Math.sin(t*0.05+p)+1)/2;

  ctx.fillStyle=rgba(palette.purple,0.09+glow*0.07);
  ctx.beginPath();
  ctx.arc(px,py,5.2,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle=rgba(palette.orange,0.24+glow*0.14);
  ctx.beginPath();
  ctx.arc(px,py,2.3,0,Math.PI*2);
  ctx.fill();
}

function draw(){
  ctx.clearRect(0,0,W,H);

  const w=canvas.clientWidth;
  const h=canvas.clientHeight;

  const mapped=nodes.map(n=>({
    ...n,
    r:nodeRadius(n,w,h),
    px:n.x*w+Math.sin(t*0.006+n.x*10)*(n.type==="domain"?8:5),
    py:n.y*h+Math.cos(t*0.008+n.y*10)*(n.type==="domain"?8:5)
  }));

  domainLinks.forEach(([a,b],i)=>drawSoft(mapped[a],mapped[b],0.065,i));
  flowLinks.forEach(([a,b],i)=>drawArrow(mapped[a],mapped[b],palette.orange,0.48,2.1,i));

  mapped.forEach((n,i)=>{
    const g=(Math.sin(t*0.026+i)+1)/2;

    ctx.fillStyle=rgba(
      n.halo,
      n.type==="domain"?0.03+g*0.025:0.028+g*0.025
    );
    ctx.beginPath();
    ctx.arc(
      n.px,n.py,
      n.r+(n.type==="domain"?15:11)+g*5,
      0,Math.PI*2
    );
    ctx.fill();

    ctx.fillStyle=n.fill;
    ctx.strokeStyle=n.stroke;
    ctx.lineWidth=n.type==="domain"?2.1:1.8;
    ctx.beginPath();
    ctx.arc(n.px,n.py,n.r,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    const fs=fontSize(n,w,h);
    ctx.fillStyle=n.text;
    ctx.font=n.type==="domain"
      ? `500 ${fs}px Roboto, Arial, sans-serif`
      : `500 ${fs}px DM Mono, monospace`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    drawTextBlock(
      n.label,
      n.px,
      n.py,
      n.r*1.55,
      n.type==="domain"?fs*1.28:fs*1.2
    );
  });

  t++;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
