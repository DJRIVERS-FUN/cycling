<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK Japan Bio Motion</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#ffffff; overflow:hidden; font-family:"DM Mono", monospace; }
  .wrap { width:100%; height:360px; max-width:520px; margin:0 auto; position:relative; background:#ffffff; }
  canvas { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<div class="wrap"><canvas id="motion"></canvas></div>
<script>
const canvas = document.getElementById("motion");
const ctx = canvas.getContext("2d");
let W,H,t=0;

const palette = {
  purple:"#520671",
  orange:"#e05c2a",
  grey:"#6e6c66"
};

function resize(){
  const r = canvas.getBoundingClientRect();
  W = canvas.width = r.width * devicePixelRatio;
  H = canvas.height = r.height * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resize();
window.addEventListener("resize", resize);

function rgba(h,a){
  const x=h.replace("#","");
  return `rgba(${parseInt(x.substr(0,2),16)},${parseInt(x.substr(2,2),16)},${parseInt(x.substr(4,2),16)},${a})`;
}

function drawCurve(points, color, alpha, width) {
  ctx.strokeStyle = rgba(color, alpha);
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length - 1; i++) {
    const mx = (points[i].x + points[i+1].x) / 2;
    const my = (points[i].y + points[i+1].y) / 2;
    ctx.quadraticCurveTo(points[i].x, points[i].y, mx, my);
  }
  ctx.lineTo(points[points.length-1].x, points[points.length-1].y);
  ctx.stroke();
}

function path(w,h){
  return [
    {x:w*0.15,y:h*0.6},
    {x:w*0.3,y:h*0.25},
    {x:w*0.5,y:h*0.5},
    {x:w*0.7,y:h*0.2},
    {x:w*0.85,y:h*0.55}
  ];
}

function interp(p,pts){
  const n=pts.length-1;
  const raw=p*n;
  const i=Math.floor(raw);
  const f=raw-i;
  const A=pts[i],B=pts[i+1];
  return {x:A.x+(B.x-A.x)*f,y:A.y+(B.y-A.y)*f};
}

function drawSpark(x,y,color,alpha){
  ctx.fillStyle = rgba(color, alpha);
  ctx.beginPath();
  ctx.arc(x,y,1.6,0,Math.PI*2);
  ctx.fill();
}

function drawWheel(x,y,r,phase,color){
  ctx.fillStyle=rgba(color,0.08);
  ctx.beginPath();ctx.arc(x,y,r+10,0,Math.PI*2);ctx.fill();

  ctx.strokeStyle=color;
  ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();

  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();

  const spokes=8;
  for(let i=0;i<spokes;i++){
    const angle=(i/spokes)*Math.PI*2+phase;
    ctx.strokeStyle=rgba(color,0.35);
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x+Math.cos(angle)*r,y+Math.sin(angle)*r);
    ctx.stroke();
  }
}

function draw(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  ctx.clearRect(0,0,W,H);

  const pts = path(w,h);

  drawCurve(pts, palette.purple, 0.22, 1.4);
  drawCurve([...pts].reverse(), palette.orange, 0.18, 1.1);

  for(let i=0;i<20;i++){
    const p=(i/20 + t*0.002)%1;
    const d=interp(p,pts);
    drawSpark(d.x,d.y, i%2?palette.purple:palette.orange, 0.12);
  }

  const p1=(Math.sin(t*0.01)+1)/2;
  const p2=(Math.sin(t*0.01+Math.PI)+1)/2;

  const a=interp(p1,pts);
  const b=interp(p2,pts);

  drawWheel(a.x,a.y,22,t*0.05,palette.purple);
  drawWheel(b.x,b.y,22,-t*0.05,palette.orange);

  t++;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
