<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK Japan Bio Motion</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#ffffff; overflow:hidden; font-family:"DM Mono", monospace; }
  .wrap { width:100%; height:360px; max-width:520px; margin:0 auto; position:relative; background:#ffffff; }
  canvas { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<div class="wrap"><canvas id="motion"></canvas></div>
<script>
const canvas = document.getElementById("motion");
const ctx = canvas.getContext("2d");
let W,H,t=0;

const palette = {
  purple:"#520671",
  grey:"#6e6c66",
  japan:"#bc002d",
  ukBlue:"#1f3f7a",
  ukRed:"#c8102e"
};

function resize(){
  const r = canvas.getBoundingClientRect();
  W = canvas.width = r.width * devicePixelRatio;
  H = canvas.height = r.height * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resize();
window.addEventListener("resize", resize);

function rgba(h,a){
  const x=h.replace("#","");
  return `rgba(${parseInt(x.substr(0,2),16)},${parseInt(x.substr(2,2),16)},${parseInt(x.substr(4,2),16)},${a})`;
}

/* --- Curved research network --- */
const nodes=[];
for(let i=0;i<18;i++){
  nodes.push({x:Math.random(),y:Math.random(),phase:Math.random()*6.28});
}

function drawNetwork(w,h){
  nodes.forEach((a,i)=>{
    nodes.forEach((b,j)=>{
      if(i<j){
        const dx=(a.x-b.x)*w;
        const dy=(a.y-b.y)*h;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<140){
          const mx=(a.x+b.x)/2 + Math.sin(t*0.01+a.phase)*0.02;
          const my=(a.y+b.y)/2 + Math.cos(t*0.01+b.phase)*0.02;
          ctx.strokeStyle = rgba(palette.grey,0.06);
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(a.x*w,a.y*h);
          ctx.quadraticCurveTo(mx*w,my*h,b.x*w,b.y*h);
          ctx.stroke();
        }
      }
    });
  });

  nodes.forEach(n=>{
    ctx.fillStyle = rgba(palette.grey,0.12);
    ctx.beginPath();
    ctx.arc(n.x*w,n.y*h,1.4,0,Math.PI*2);
    ctx.fill();
  });
}

/* --- Path --- */
function path(w,h){
  return [
    {x:w*0.15,y:h*0.6},
    {x:w*0.3,y:h*0.25},
    {x:w*0.5,y:h*0.5},
    {x:w*0.7,y:h*0.2},
    {x:w*0.85,y:h*0.55}
  ];
}

function interp(p,pts){
  const n=pts.length-1;
  const raw=p*n;
  const i=Math.floor(raw);
  const f=raw-i;
  const A=pts[i],B=pts[i+1];
  return {x:A.x+(B.x-A.x)*f,y:A.y+(B.y-A.y)*f};
}

/* --- UK --- */
function drawUK(x,y,r){
  ctx.fillStyle=rgba(palette.ukBlue,0.1);
  ctx.beginPath();ctx.arc(x,y,r+10,0,6.28);ctx.fill();

  ctx.save();
  ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.clip();

  ctx.fillStyle=palette.ukBlue;
  ctx.fillRect(x-r,y-r,r*2,r*2);

  ctx.strokeStyle="#fff";
  ctx.lineWidth=r*0.35;
  ctx.beginPath();
  ctx.moveTo(x-r,y-r);ctx.lineTo(x+r,y+r);
  ctx.moveTo(x+r,y-r);ctx.lineTo(x-r,y+r);
  ctx.stroke();

  ctx.strokeStyle=palette.ukRed;
  ctx.lineWidth=r*0.18;
  ctx.beginPath();
  ctx.moveTo(x-r,y-r);ctx.lineTo(x+r,y+r);
  ctx.moveTo(x+r,y-r);ctx.lineTo(x-r,y+r);
  ctx.stroke();

  ctx.restore();
}

/* --- Japan --- */
function drawJP(x,y,r){
  ctx.fillStyle=rgba(palette.japan,0.1);
  ctx.beginPath();ctx.arc(x,y,r+10,0,6.28);ctx.fill();

  ctx.fillStyle="#fff";
  ctx.strokeStyle=palette.japan;
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fill();ctx.stroke();

  ctx.fillStyle=palette.japan;
  ctx.beginPath();ctx.arc(x,y,r*0.42,0,6.28);ctx.fill();
}

/* --- MAIN --- */
function draw(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  ctx.clearRect(0,0,W,H);

  drawNetwork(w,h);

  const pts=path(w,h);

  ctx.strokeStyle=rgba(palette.purple,0.2);
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.stroke();

  const p1=(Math.sin(t*0.01)+1)/2;
  const p2=(Math.sin(t*0.01+Math.PI)+1)/2;

  const a=interp(p1,pts);
  const b=interp(p2,pts);

  drawUK(a.x,a.y,22);
  drawJP(b.x,b.y,22);

  t++;
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
