<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK Japan Bio Motion</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#ffffff; overflow:hidden; font-family:"DM Mono", monospace; }
  .wrap { width:100%; height:360px; max-width:520px; margin:0 auto; position:relative; background:#ffffff; }
  canvas { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<div class="wrap"><canvas id="motion"></canvas></div>
<script>
const canvas=document.getElementById("motion");
const ctx=canvas.getContext("2d");
let W,H,t=0;

const palette={purple:"#520671",orange:"#e05c2a",grey:"#6e6c66",japanRed:"#bc002d",ukBlue:"#1f3f7a"};

function resize(){const r=canvas.getBoundingClientRect();W=canvas.width=r.width*devicePixelRatio;H=canvas.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}resize();window.addEventListener("resize",resize);

function rgba(h,a){const x=h.replace("#","");return `rgba(${parseInt(x.substr(0,2),16)},${parseInt(x.substr(2,2),16)},${parseInt(x.substr(4,2),16)},${a})`;}

// persistent network
const netNodes=[];
for(let i=0;i<22;i++){
  netNodes.push({x:Math.random(),y:Math.random()});
}

function drawNetwork(w,h){
  netNodes.forEach((a,i)=>{
    netNodes.forEach((b,j)=>{
      if(i<j){
        const dx=(a.x-b.x)*w;
        const dy=(a.y-b.y)*h;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<140){
          ctx.strokeStyle=rgba(palette.grey,0.06);
          ctx.lineWidth=0.6;
          ctx.beginPath();
          ctx.moveTo(a.x*w,a.y*h);
          ctx.lineTo(b.x*w,b.y*h);
          ctx.stroke();
        }
      }
    });
  });

  netNodes.forEach(n=>{
    ctx.fillStyle=rgba(palette.grey,0.14);
    ctx.beginPath();
    ctx.arc(n.x*w,n.y*h,1.5,0,Math.PI*2);
    ctx.fill();
  });
}

function pathPoints(w,h){
  return [
    {x:w*0.15,y:h*0.6},
    {x:w*0.3,y:h*0.25},
    {x:w*0.5,y:h*0.5},
    {x:w*0.7,y:h*0.2},
    {x:w*0.85,y:h*0.55}
  ];
}

function interp(points,p){
  const total=points.length-1;
  const raw=p*total;
  const i=Math.min(Math.floor(raw),total-1);
  const local=raw-i;
  const A=points[i],B=points[i+1];
  return {x:A.x+(B.x-A.x)*local,y:A.y+(B.y-A.y)*local};
}

function drawOrb(x,y,r,color){
  ctx.fillStyle=rgba(color,0.12);
  ctx.beginPath();ctx.arc(x,y,r+10,0,Math.PI*2);ctx.fill();

  ctx.fillStyle="#fff";
  ctx.strokeStyle=color;
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();

  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r*0.4,0,Math.PI*2);ctx.fill();
}

function draw(){
  const w=canvas.clientWidth;
  const h=canvas.clientHeight;
  ctx.clearRect(0,0,W,H);

  drawNetwork(w,h);

  const pts=pathPoints(w,h);

  ctx.strokeStyle=rgba(palette.purple,0.2);
  ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.stroke();

  const p1=(Math.sin(t*0.01)+1)/2;
  const p2=(Math.sin(t*0.01+Math.PI)+1)/2;

  const uk=interp(pts,p1);
  const jp=interp(pts,p2);

  drawOrb(uk.x,uk.y,22,palette.ukBlue);
  drawOrb(jp.x,jp.y,22,palette.japanRed);

  t++;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
